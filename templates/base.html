<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karuna{% block title %}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07080a;color:#f9f9f9;font-family:'Inter',system-ui,sans-serif;font-size:14px;letter-spacing:0.2px;min-height:100vh}
a{color:inherit;text-decoration:none}
.topbar{background:#101111;border-bottom:1px solid rgba(255,255,255,0.06);height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:#FF9F1C;box-shadow:0 0 0 3px rgba(255,159,28,0.15)}
.logo-text{font-size:13px;font-weight:600;color:#f9f9f9;letter-spacing:0.3px}
.logo-ver{font-size:11px;color:#6a6b6c;background:#1b1c1e;padding:2px 7px;border-radius:4px}
.next-run{font-size:12px;color:#9c9c9d}
.next-run span{color:#FF9F1C;font-weight:500}
.layout{display:flex;min-height:calc(100vh - 48px)}
.sidebar{width:176px;background:#0c0d0f;border-right:1px solid rgba(255,255,255,0.05);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:48px;height:calc(100vh - 48px)}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:#6a6b6c;letter-spacing:0.2px;border:1px solid transparent}
.nav-item:hover{color:#9c9c9d;background:rgba(255,255,255,0.03)}
.nav-item.active{background:rgba(255,159,28,0.1);color:#FF9F1C;border-color:rgba(255,159,28,0.15)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0.6;flex-shrink:0}
.nav-item.active .nav-dot{opacity:1}
.content{flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;max-width:900px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:#101111;border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:14px}
.stat-label{font-size:10px;color:#6a6b6c;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:500;color:#f9f9f9;line-height:1}
.stat-sub{font-size:11px;color:#434345;margin-top:4px}
.card{background:#101111;border:1px solid rgba(255,255,255,0.06);border-radius:8px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:500;color:#f9f9f9}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feed-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03)}
.cat-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:0.4px;flex-shrink:0}
.cat-tech{background:rgba(88,101,242,0.18);color:#8b9cf7}
.cat-gaming{background:rgba(87,242,135,0.13);color:#57F287}
.cat-world{background:rgba(255,159,28,0.15);color:#FF9F1C}
.feed-name{font-size:13px;color:#cecece;flex:1}
.feed-url{font-size:11px;color:#434345;font-family:monospace}
.btn{font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#f9f9f9;cursor:pointer;font-weight:500;letter-spacing:0.2px}
.btn:hover{background:rgba(255,255,255,0.09)}
.btn-danger{border-color:rgba(255,99,99,0.2);color:#9c9c9d}
.btn-danger:hover{color:#FF6363;border-color:rgba(255,99,99,0.4);background:rgba(255,99,99,0.05)}
.btn-primary{background:#FF9F1C;border-color:#FF9F1C;color:#07080a;font-weight:700}
.btn-primary:hover{background:#d97f00;border-color:#d97f00}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;color:#9c9c9d;letter-spacing:0.2px}
.form-input{background:#07080a;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:#f9f9f9;font-size:13px;font-family:'Inter',system-ui,sans-serif;outline:none;width:100%}
.form-input:focus{border-color:rgba(255,159,28,0.5);box-shadow:0 0 0 3px rgba(255,159,28,0.08)}
.form-select{background:#07080a;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:#f9f9f9;font-size:13px;outline:none;width:100%}
.form-select:focus{border-color:rgba(255,159,28,0.5)}
.form-row-inline{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.log-line{font-family:monospace;font-size:11px;color:#6a6b6c;display:flex;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-line:last-child{border-bottom:none}
.log-ts{color:#434345;flex-shrink:0}
.log-ok{color:#57F287}
.log-info{color:#5865F2}
.log-warn{color:#FF9F1C}
.log-err{color:#FF6363}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px}
.status-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:#6a6b6c}
.status-dot{width:6px;height:6px;border-radius:50%;background:#57F287;box-shadow:0 0 0 2px rgba(87,242,135,0.2)}
.flash{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:4px}
.flash-ok{background:rgba(87,242,135,0.08);border:1px solid rgba(87,242,135,0.2);color:#57F287}
.flash-err{background:rgba(255,99,99,0.08);border:1px solid rgba(255,99,99,0.2);color:#FF6363}
.flash-warn{background:rgba(255,159,28,0.08);border:1px solid rgba(255,159,28,0.2);color:#FF9F1C}
.hint{font-size:11px;color:#434345;margin-top:4px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-dot"></div>
    <span class="logo-text">Karuna</span>
    <span class="logo-ver">v0.2.0</span>
  </div>
  {% if session.get('authed') %}<span class="next-run">next run <span>{{ next_run }}</span></span>{% endif %}
</div>
{% block body %}{% endblock %}
</body>
</html>
